name: Build Physics Lab APK

on:
  workflow_dispatch:
  push:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            autoconf \
            pkg-config \
            gettext \
            autopoint \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            cmake \
            git \
            zip \
            unzip

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi
          pip install setuptools
          pip install cython==0.29.34

      - name: Prepare Android build
        run: |
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Physics-Lab-APK
          path: bin/*.apk
